name: Build Linux Binary

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o molt .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: molt-linux-amd64
          path: molt
